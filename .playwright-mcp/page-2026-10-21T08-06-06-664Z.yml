    - generic [ref=f4e243]:
      - generic [ref=f4e244]:
        - generic [ref=f4e245]: Got Questions?
        - heading "Frequently Asked Questions" [level=2] [ref=f4e246]
      - generic [ref=f4e247]:
        - generic [ref=f4e248]:
          - button "How do I become a Chamet agent?" [ref=f4e249] [cursor=pointer]
          - paragraph [ref=f4e255]: You must register through the official Chamet Agency Registration form. The process requires an active phone number. Once registered, you can immediately start recruiting hosts and sub-agents.
        - generic [ref=f4e256]:
          - button "What if I don't receive my OTP/SMS code?" [ref=f4e257] [cursor=pointer]
          - paragraph [ref=f4e263]: This is typically caused by network delays. Double-check the phone number, or wait a few minutes and try resending. If the issue persists, contact support.
        - generic [ref=f4e264]:
          - button "How is my agent commission calculated?" [ref=f4e265] [cursor=pointer]
          - paragraph [ref=f4e271]: Your daily commission rate is based on your entire team's total earnings over the last 30 days. For new agents (less than 30 days old), the rate is calculated from your registration day up to yesterday.
        - generic [ref=f4e272]:
          - button "Can I add existing Chamet users to my agency?" [ref=f4e273] [cursor=pointer]
          - paragraph [ref=f4e279]: No. Only new users who register through your specific referral link can be added to your team. Existing users cannot be manually bound to your agency.
        - generic [ref=f4e280]:
          - button "Are there rules against poaching hosts from other agencies?" [ref=f4e281] [cursor=pointer]
          - paragraph [ref=f4e287]: Yes. Chamet strictly prohibits recruiting hosts or sub-agents who are already active on the platform under another agency. Violating this rule may result in account suspension.
        - generic [ref=f4e288]:
          - button "How do I withdraw my commission as an agent?" [ref=f4e289] [cursor=pointer]
          - paragraph [ref=f4e295]: You must bind a MetWallet account to your agency backend (found in My Profile → MetWallet Account → Bind Wallet). Once your accumulated commission reaches $10, you can withdraw your earnings.
        - generic [ref=f4e296]:
          - button "How much commission can I really earn as an agent?" [ref=f4e297] [cursor=pointer]
          - paragraph [ref=f4e303]: "Your commission range is transparent: from 5% up to 30% of your team's total earnings. The exact percentage depends on your team's combined revenue over the rolling 30-day period."
        - generic [ref=f4e304]:
          - button "What do I need to start my agency immediately?" [ref=f4e305] [cursor=pointer]
          - paragraph [ref=f4e311]: Just a verified phone number. Start recruiting your team members right away. To withdraw funds, you'll need to complete the MetWallet verification, but there's no cost to register or build your team.
