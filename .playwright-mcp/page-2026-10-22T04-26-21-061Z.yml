          - generic [ref=f2e303]:
            - button "How do I become a Chamet agent?" [ref=f2e304] [cursor=pointer]
            - paragraph [ref=f2e310]: You must register through the official Chamet Agency Registration form. The process requires an active phone number. Once registered, you can immediately start recruiting hosts and sub-agents.
          - generic [ref=f2e311]:
            - button "What if I don't receive my OTP/SMS code?" [ref=f2e312] [cursor=pointer]
            - paragraph [ref=f2e318]: This is typically caused by network delays. Double-check the phone number, or wait a few minutes and try resending. If the issue persists, contact support.
          - generic [ref=f2e319]:
            - button "How is my agent commission calculated?" [ref=f2e320] [cursor=pointer]
            - paragraph [ref=f2e326]: Your daily commission rate is based on your entire team's total earnings over the last 30 days. For new agents (less than 30 days old), the rate is calculated from your registration day up to yesterday.
          - generic [ref=f2e327]:
            - button "Can I add existing Chamet users to my agency?" [ref=f2e328] [cursor=pointer]
            - paragraph [ref=f2e334]: No. Only new users who register through your specific referral link can be added to your team. Existing users cannot be manually bound to your agency.
          - generic [ref=f2e335]:
            - button "Are there rules against poaching hosts from other agencies?" [ref=f2e336] [cursor=pointer]
            - paragraph [ref=f2e342]: Yes. Chamet strictly prohibits recruiting hosts or sub-agents who are already active on the platform under another agency. Violating this rule may result in account suspension.
          - generic [ref=f2e343]:
            - button "How do I withdraw my commission as an agent?" [ref=f2e344] [cursor=pointer]
            - paragraph [ref=f2e350]: You must bind a MetWallet account to your agency backend (found in My Profile → MetWallet Account → Bind Wallet). Once your accumulated commission reaches $10, you can withdraw your earnings.
          - generic [ref=f2e351]:
            - button "How much commission can I really earn as an agent?" [ref=f2e352] [cursor=pointer]
            - paragraph [ref=f2e358]: "Your commission range is transparent: from 5% up to 30% of your team's total earnings. The exact percentage depends on your team's combined revenue over the rolling 30-day period."
          - generic [ref=f2e359]:
            - button "What do I need to start my agency immediately?" [ref=f2e360] [cursor=pointer]
            - paragraph [ref=f2e366]: Just a verified phone number. Start recruiting your team members right away. To withdraw funds, you'll need to complete the MetWallet verification, but there's no cost to register or build your team.
