      - generic [ref=f4e460]:
        - generic [ref=f4e461]:
          - button "How much commission can a Chamet agent earn?" [ref=f4e462] [cursor=pointer]
          - paragraph [ref=f4e468]: Your commission rate ranges from 5% to 30% of your team's total earnings. The more your team earns, the higher your percentage climbs.
        - generic [ref=f4e469]:
          - button "What does a Chamet agent actually do?" [ref=f4e470] [cursor=pointer]
          - paragraph [ref=f4e476]: You're responsible for mentoring your hosts and sub‑agents, keeping them updated on platform events, and continuously expanding your network. Your success is directly tied to theirs.
        - generic [ref=f4e477]:
          - button "Can I recruit from other agencies?" [ref=f4e478] [cursor=pointer]
          - paragraph [ref=f4e484]: No. Hosts and sub‑agents must first leave their existing agency before they can join yours. Poaching active members is strictly prohibited.
        - generic [ref=f4e485]:
          - button "What do I need to start my agency?" [ref=f4e486] [cursor=pointer]
          - paragraph [ref=f4e492]: Just a verified phone number to begin recruiting. To withdraw funds, you'll need to attach a verified MetWallet to your profile, but there's no cost to register or start building your team.
        - generic [ref=f4e493]:
          - button "Is the Chamet commission system secure?" [ref=f4e494] [cursor=pointer]
          - paragraph [ref=f4e500]: Absolutely. Chamet has over 50M Play Store downloads and a global user base. You never pay to withdraw, just meet the requirements and Chamet sends your rightful commission directly to your wallet.
        - generic [ref=f4e501]:
          - button "Where can I get help if something goes wrong?" [ref=f4e502] [cursor=pointer]
          - paragraph [ref=f4e508]: Contact our support team, we'll connect you with platform admins to resolve any issue quickly. Your data, team info, and payment details stay fully private at all times.
