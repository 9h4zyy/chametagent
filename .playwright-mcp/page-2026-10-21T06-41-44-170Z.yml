          - button "How can I register as a Chamet host?" [ref=f1e247] [cursor=pointer]
          - paragraph [ref=f1e253]: Complete the pre-registration (often provided by your agent), download the app, and sign in using the same credentials. It's free and open to beginners.
        - generic [ref=f1e254]:
          - button "What determines my earning potential on the platform?" [ref=f1e255] [cursor=pointer]
          - paragraph [ref=f1e261]: Every interaction counts, livestreams, private calls, gifts, and special features all contribute. There is no earning cap, and your agent is incentivized to help you maximize every opportunity.
        - generic [ref=f1e262]:
          - button "Do new Chamet hosts receive a basic salary?" [ref=f1e263] [cursor=pointer]
          - paragraph [ref=f1e269]: Not right away. New hosts need to meet specific activity and performance criteria first. Your agent will guide you through these requirements and help you unlock salary eligibility faster.
        - generic [ref=f1e270]:
          - button "Can I manage multiple accounts at the same time?" [ref=f1e271] [cursor=pointer]
          - paragraph [ref=f1e277]: No. Chamet strictly allows only one account per individual.
        - generic [ref=f1e278]:
          - button "How and when can I withdraw my funds?" [ref=f1e279] [cursor=pointer]
          - paragraph [ref=f1e285]: You can withdraw once your balance reaches $10 (100,000 Beans). Payments are processed in $10 increments.
        - generic [ref=f1e286]:
          - button "How is my privacy protected while streaming?" [ref=f1e287] [cursor=pointer]
          - paragraph [ref=f1e293]: Chamet enforces strict policies against sharing personal information. Violations may result in suspension or a permanent ban.
        - generic [ref=f1e294]:
          - button "What payment or withdrawal methods are available?" [ref=f1e295] [cursor=pointer]
          - paragraph [ref=f1e301]: For top-ups, Google Pay and Apple Pay are supported. Withdrawals go through MetWallet, which supports USDT, local bank transfers, e-wallets, and Epay in many regions.
